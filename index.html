<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생각 나눔 보드</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--p:#f8c4d3;--pd:#e58aa6;--pl:#fff1f5;--bg:#fffbfc;--tx:#3b3238;--mu:#8f7f87;--bd:#f2dfe5}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.btn{background:var(--pd);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.btn.soft{background:var(--p);color:#6b3045}
.btn.line{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn:focus-visible,.lk:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--p);outline-offset:1px}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.lk{background:none;border:0;color:var(--pd);font-weight:700;padding:0}
/* 첫 화면 */
#landing{max-width:760px;margin:0 auto;padding:60px 20px;text-align:center}
#landing h1{font-size:44px;margin:0 0 6px;letter-spacing:-1px}
#landing p.sub{color:var(--mu);margin:0 0 36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
.panel{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px}
.panel h2{margin:0 0 4px;font-size:20px}
.panel .btn{width:100%;margin-top:16px}
#setup{background:var(--pl);border:1px dashed var(--pd);border-radius:12px;padding:12px;margin-bottom:20px;text-align:left;font-size:14px}
/* 교실 */
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:var(--pl);border-bottom:2px solid var(--p);position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;margin-right:auto}
.chip{background:#fff;border:1px solid var(--p);border-radius:99px;padding:3px 12px;font-size:14px}
#tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--bd);background:#fff}
#tbar select,#tbar input{width:auto}
#board{padding:20px;columns:280px;column-gap:16px}
.card{break-inside:avoid;background:#fff;border:1px solid var(--bd);border-top:5px solid var(--p);border-radius:14px;padding:14px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.card p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card footer{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:14px;margin-top:6px}
.card footer span{margin-right:auto}
.empty{color:var(--mu);text-align:center;padding:60px 0;column-span:all}
#fab{position:fixed;right:22px;bottom:22px;border-radius:99px;padding:14px 22px;box-shadow:0 6px 18px #e58aa655;z-index:6}
/* 발표 */
#present{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px 20px;height:calc(100vh - 62px)}
#present.t{grid-template-columns:200px 1fr 380px;height:calc(100vh - 118px)}
#present>div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;overflow:auto;min-height:0}
#pList .pick{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
#pList .pick.on{background:var(--p);border-color:var(--pd)}
#pList small{display:block;color:var(--mu)}
#pPost h2{margin:0 0 8px}
#pPost p{white-space:pre-wrap;font-size:18px;word-break:break-word}
#pSide{display:flex;flex-direction:column}
#cq{font-weight:700;background:var(--pl);border-radius:10px;padding:8px 12px;margin-bottom:10px}
#cList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cm{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.cm b{font-size:14px}
.cm .lkbtn{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:1px 10px;font-size:13px;margin-top:4px}
.cm .lkbtn.on{background:var(--p);border-color:var(--pd)}
#cloud{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-content:flex-start;align-items:center;padding:8px}
.w{font-weight:800;line-height:1.2}
.row{display:flex;gap:8px}
.row .btn{white-space:nowrap}
/* 작성창 */
#modal{position:fixed;inset:0;background:#3b323866;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal>div{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
/* 화면 높이가 작거나 키보드가 열린 태블릿에서도 입력창까지 스크롤할 수 있습니다. */
body.lock{overflow:auto}
.card h3{font-size:23px;line-height:1.4;font-weight:800;color:#652d46}
.card footer{flex-wrap:wrap}
.card footer span{font-size:18px;font-weight:800;color:#652d46;overflow-wrap:anywhere}
#present{grid-template-columns:minmax(0,1fr) minmax(340px,440px);height:auto;min-height:calc(100vh - 90px);align-items:start}
#present.t{grid-template-columns:180px minmax(0,1fr) minmax(340px,440px);height:auto;min-height:calc(100vh - 180px)}
#present>div{min-width:0;overflow:visible}
#pPost h2{font-size:30px;line-height:1.4;overflow-wrap:anywhere;color:#652d46}
#pPost p{font-size:24px;line-height:1.8}
#pPost small{font-size:19px!important;font-weight:800;color:#652d46!important}
#pList .pick{font-size:18px;font-weight:700;overflow-wrap:anywhere}
#pList small,.cm b{font-size:17px;font-weight:800;color:#652d46}
#pSide{min-height:350px;gap:8px}
#cList,#cloud{flex:0 1 auto;min-height:120px;max-height:48vh;overflow:auto}
#cList .cm{flex-shrink:0;overflow-wrap:anywhere}
#commentForm{flex:0 0 auto;background:#fff;padding:8px 0 max(8px,env(safe-area-inset-bottom));align-items:center}
#cInput{min-width:0;flex:1;font-size:16px}
#cSend{flex-shrink:0}
#cloud .w{overflow-wrap:anywhere;max-width:100%}
#presence{margin:12px 20px;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--pl)}
#presenceNames{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#presenceNames span{background:#fff;border:1px solid var(--p);border-radius:20px;padding:3px 12px;font-weight:700}
#presenceStatus{display:block;color:var(--mu);font-size:13px}
@media(max-width:1100px){#present,#present.t{grid-template-columns:minmax(0,1fr) minmax(300px,40%)}#present.t #pList{grid-column:1 / -1;display:flex;gap:8px;overflow:auto}#pList .pick{min-width:150px;margin:0}}
@media(max-width:820px){.two{grid-template-columns:1fr}#present,#present.t{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;padding:12px}#present.t #pList{grid-column:auto}#pSide{min-height:300px}#cList,#cloud{max-height:35vh}#tOpts{flex-wrap:wrap}#qInput{width:100%!important}#pPost p{font-size:22px}#presence{margin:10px 12px}}
.rejoin{border-top:1px solid var(--bd);margin-top:20px;padding-top:6px}
.hint{font-size:13px;color:var(--mu);margin:8px 0}
#wordHint{flex:none;margin:0}
#cloud.manage .w{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;padding:4px;border:2px solid transparent;border-radius:8px}
#cloud.manage .w:focus-visible{outline:3px solid var(--pd)}
#cloud .w.drop-target{background:var(--pl);border-color:var(--pd)}
#cloud .w.drag-source{opacity:.45}
#cloud.busy{opacity:.6;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#wordMenu{position:fixed;z-index:40;min-width:210px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 6px 24px #3b323833}
#wordMenu strong{display:block;padding:5px 10px;max-width:240px;overflow-wrap:anywhere}
#wordMenu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px 10px;border-radius:8px}
#wordMenu button:hover,#wordMenu button:focus-visible{background:var(--pl)}
#wordModal{position:fixed;inset:0;background:#3b323866;display:flex;align-items:center;justify-content:center;z-index:45;padding:16px}
#wordModal>div{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
#wordModal h2{margin-top:0}
.tv-mode #room>header{position:fixed;top:10px;right:16px;z-index:10;padding:0;background:none;border:0}
.tv-mode #room>header>*:not(#tvBtn){display:none}
.tv-mode #tbar,.tv-mode #presence,.tv-mode #pList{display:none!important}
#present.tv{grid-template-columns:minmax(0,var(--tv-left,60fr)) 16px minmax(0,var(--tv-right,40fr));gap:8px;padding:64px 20px 20px;height:100vh;height:100dvh;min-height:0;align-items:stretch}
#present.tv #pPost{overflow:auto}
#present.tv #pPost p{font-size:clamp(24px,2.1vw,36px)}
#present.tv #pSide{min-height:0;overflow:hidden}
#present.tv #cList,#present.tv #cloud{flex:1;min-height:0;max-height:none;overflow:auto}
#tvDivider{border:0;border-radius:12px;background:var(--pl);padding:0;cursor:col-resize;touch-action:none;min-width:16px;position:relative}
#tvDivider::after{content:'';position:absolute;top:35%;bottom:35%;left:6px;width:4px;border-radius:4px;background:var(--pd)}
#tvDivider:focus-visible{outline:3px solid var(--pd)}
body.resizing{cursor:col-resize;user-select:none}
.postActions{display:flex;gap:12px;margin-top:12px}
</style>
</head>
<body>

<section id="landing">
  <h1>💭 생각 나눔 보드</h1>
  <p class="sub">내 생각을 쓰고, 친구들의 생각을 읽어요</p>
  <div id="setup" class="hide"><b>Firebase 설정이 필요해요.</b> 파일 위쪽 <code>firebaseConfig</code>에 본인의 값을 넣어주세요.</div>
  <div class="two">
    <div class="panel">
      <h2>학생 입장</h2>
      <label for="jc">학급 코드 (5자리 숫자)</label>
      <input id="jc" inputmode="numeric" maxlength="5" placeholder="12345">
      <label for="jn">내 이름</label>
      <input id="jn" maxlength="10" placeholder="이름 또는 닉네임">
      <button class="btn" id="joinBtn">들어가기</button>
    </div>
    <div class="panel">
      <h2>교사</h2>
      <p style="color:var(--mu);margin:4px 0 0">새 교실을 열면 5자리 학급 코드가 만들어져요. 코드와 교실은 24시간 동안 유지돼요.</p>
      <button class="btn soft" id="createBtn">교실 개설하기</button>
      <div class="rejoin">
        <label for="teacherCode">기존 학급 코드</label>
        <input id="teacherCode" inputmode="numeric" maxlength="5" placeholder="다시 들어갈 학급 코드">
        <button class="btn line" id="rejoinTeacherBtn">교실 다시 들어가기</button>
        <p class="hint">교실을 개설한 PC의 같은 브라우저에서만 교사로 복귀할 수 있어요.</p>
      </div>
    </div>
  </div>
</section>

<section id="room" class="hide">
  <header>
    <h1>💭 생각 나눔 보드</h1>
    <span class="chip">학급 코드 <b id="hCode"></b></span>
    <span class="chip" id="hName"></span>
    <button class="btn soft hide" id="tvBtn" aria-pressed="false">TV 공유 모드</button>
    <button class="btn line" id="leaveBtn">나가기</button>
  </header>
  <div id="tbar" class="hide">
    <button class="btn" id="modeBtn"></button>
    <span id="tOpts" class="row hide" style="align-items:center">
      <select id="cmode" aria-label="댓글 방식"><option value="sns">댓글 + 공감</option><option value="word">짧은 단어 모으기</option></select>
      <input id="qInput" placeholder="학생들에게 물어볼 질문 (예: 이 글을 읽고 드는 감정은?)" style="width:340px;max-width:100%">
    </span>
  </div>
  <aside id="presence" class="hide" aria-label="접속자 목록"><b id="presenceCount">접속자 0명</b><small id="presenceStatus" role="status"></small><div id="presenceNames"></div></aside>
  <main id="board"></main>
  <div id="present" class="hide">
    <div id="pList" class="hide"></div>
    <div id="pPost"></div>
    <button id="tvDivider" class="hide" role="separator" aria-label="글과 댓글의 너비 조절" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="60" title="좌우로 드래그하거나 방향키로 너비를 조절하세요"></button>
    <div id="pSide">
      <div id="cq" class="hide"></div>
      <div id="cList"></div>
      <div id="cloud" class="hide"></div>
      <p id="wordHint" class="hint hide">답변을 다른 답변 위로 드래그하면 합쳐져요. 우클릭하거나 눌러서 수정·삭제할 수 있어요.</p>
      <div class="row" id="commentForm">
        <input id="cInput" maxlength="80" placeholder="댓글을 입력하세요">
        <button class="btn" id="cSend">올리기</button>
      </div>
    </div>
  </div>
  <button class="btn" id="fab">✏️ 글쓰기</button>
</section>

<div id="modal" class="hide">
  <div>
    <h2 id="mTitle" style="margin:0 0 4px">글쓰기</h2>
    <label for="eT">제목</label><input id="eT" maxlength="40">
    <label for="eB">내용</label><textarea id="eB" rows="6" maxlength="1500"></textarea>
    <p style="color:var(--mu);margin:12px 0 0;font-size:14px">작성자: <b id="eN"></b></p>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn line" id="mCancel">취소</button>
      <button class="btn" id="mSave">올리기</button>
    </div>
  </div>
</div>

<div id="wordMenu" class="hide" role="menu" aria-label="답변 관리">
  <strong id="wordMenuLabel"></strong>
  <button id="wordEditBtn" role="menuitem">답변 수정</button>
  <button id="wordMergeBtn" role="menuitem">다른 답변과 합치기</button>
  <button id="wordDeleteBtn" role="menuitem">답변 삭제</button>
</div>
<div id="wordModal" class="hide" role="dialog" aria-modal="true" aria-labelledby="wordModalTitle">
  <div>
    <h2 id="wordModalTitle">답변 수정</h2>
    <div id="wordTextField"><label for="wordText">표시할 답변</label><input id="wordText" maxlength="80"></div>
    <div id="wordTargetField" class="hide"><label for="wordTarget">합칠 대상 답변</label><select id="wordTarget"></select></div>
    <p id="wordModalHelp" class="hint"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn line" id="wordCancel">취소</button><button class="btn" id="wordSave">저장</button></div>
  </div>
</div>
<div id="wordStatus" role="status" aria-live="polite" class="sr-only"></div>

<script>
/* ▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱 에서 복사한 값으로 바꿔주세요 ▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyC16A4xDDJw84p2i38IJkATx_JeG2mIxuw",
  authDomain: "think-board-42bf6.firebaseapp.com",
  projectId: "think-board-42bf6",
  storageBucket: "think-board-42bf6.firebasestorage.app",
  messagingSenderId: "1016639275674",
  appId: "1:1016639275674:web:3aa301c6a284967ed8d523"
};/* ▲▲ ------------------------------------------------------ ▲▲ */

const ok = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db, auth, uid = null, authReady = Promise.resolve();
if (ok) {
  firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth();
  // 학생에게 보이지 않는 익명 로그인 (같은 브라우저에서는 새로고침해도 같은 ID가 유지됨)
  authReady = new Promise((res, rej) => auth.onAuthStateChanged(u => { if (u) { uid = u.uid; res(); } else auth.signInAnonymously().catch(rej); }));
  authReady.catch(() => { const b = document.getElementById('setup'); b.innerHTML = '<b>익명 로그인을 켜 주세요.</b> Firebase 콘솔 > Authentication > Sign-in method > 익명 사용 설정'; b.classList.remove('hide'); });
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (!ok) $('#setup').classList.remove('hide');

function readSession() { try { return JSON.parse(sessionStorage.getItem('tb') || localStorage.getItem('tb') || 'null'); } catch { return null; } }
let S = null, savedSession = readSession();
let room = {}, posts = [], comments = [], words = [], unsubs = [];
let expanded = new Set(), editingId = null;
let dyn = [], dynKey = '';   // 발표 중인 글의 댓글/응답 구독
let tvMode = false, tvRatio = 60;
try { tvRatio = Math.min(80,Math.max(20,Number(localStorage.getItem('tb-tv-ratio')) || 60)); $('#teacherCode').value = localStorage.getItem('tb-teacher-room') || ''; } catch {}
const isT = () => !!uid && room.teacherUid === uid;      // 교사 = 교실을 만든 브라우저
const myName = () => isT() ? '선생님' : S.name;
const roomRef = () => db.collection('rooms').doc(S.code);

/* 닉네임별 문서 하나를 트랜잭션으로 선점합니다. 두 기기가 동시에 입장해도 한 기기만 성공합니다. */
const LEASE_MS = 90000, HEARTBEAT_MS = 25000;
let serverOffset = 0;
const serverNow = () => Date.now() + serverOffset;
const seenAt = member => member.updatedAt?.toMillis?.() || 0;
const newToken = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, '0')).join('');
const nameKey = name => encodeURIComponent(name.normalize('NFC').trim().replace(/\s+/g, ' '));
let membership = null, heartbeatTimer = null, members = [], membersUnsub = null, releaseTabLock = null;
let heartbeatPending = false, joining = false, connectionError = '';
function errorMessage(err) {
  if (err.message === 'teacher-device-required') return '이 교실을 개설한 PC의 같은 브라우저에서만 교사로 다시 들어갈 수 있어요. 학생은 학생 입장 칸을 이용해 주세요.';
  if (err.message === 'invalid-name') return '닉네임은 1~10자로 입력해 주세요.';
  if (err.message === 'nickname-in-use') return '같은 학급에 이미 접속 중인 닉네임이에요. 다른 닉네임을 사용해 주세요. 이전 기기의 연결이 끊겼다면 약 90초 후 다시 시도해 주세요.';
  if (err.code === 'permission-denied') return '이 작업에 필요한 권한이 없어요. 선생님께 Firebase 규칙이 최신인지 확인해 달라고 알려 주세요.';
  if (err.message === 'word-changed') return '해당 답변이 변경되었어요. 현재 화면에서 다시 선택해 주세요.';
  if (err.message === 'room-expired') return '없거나 종료된 학급 코드예요. 코드를 다시 확인해 주세요.';
  return '연결하지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
}
async function lockTab(code, key) {
  if (!navigator.locks) return;
  await new Promise((resolve, reject) => {
    navigator.locks.request('tb:' + code + ':' + key, {ifAvailable:true}, async lock => {
      if (!lock) { reject(new Error('nickname-in-use')); return; }
      await new Promise(done => { releaseTabLock = done; resolve(); });
    }).catch(reject);
  });
}
async function claimMembership(s, data) {
  const teacherDevice = data.teacherUid === uid;
  const name = teacherDevice ? '선생님' : s.name.normalize('NFC').trim().replace(/\s+/g, ' ');
  if (!name || name.length > 10) throw new Error('invalid-name');
  if (!teacherDevice && name === '선생님') throw new Error('teacher-device-required');
  const key = nameKey(name);
  // 교사는 인증된 원래 브라우저에서 즉시 복귀하고, 이전 창의 접속은 교체합니다.
  // 학생의 닉네임 중복 접속 방지는 그대로 유지합니다.
  if (!teacherDevice) await lockTab(s.code, key);
  // Web Locks가 있는 브라우저에서는 새로고침 시 같은 세션을 복구하되 다른 탭은 차단합니다.
  const token = teacherDevice ? newToken() : (navigator.locks ? (sessionStorage.getItem('tb-token') || newToken()) : newToken());
  const ref = db.collection('rooms').doc(s.code).collection('members').doc(key);
  try {
    await db.runTransaction(async tx => {
      const roomSnap = await tx.get(db.collection('rooms').doc(s.code));
      const snap = await tx.get(ref), now = serverNow();
      if (!roomSnap.exists || roomSnap.data().expiresAt <= now) throw new Error('room-expired');
      const old = snap.exists ? snap.data() : null;
      if (!teacherDevice && old && seenAt(old) + LEASE_MS > now && (old.sessionId !== token || old.uid !== uid)) throw new Error('nickname-in-use');
      tx.set(ref, {name, uid, sessionId:token, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    sessionStorage.setItem('tb-token', token);
    membership = {ref, token, name, confirmedAt:performance.now()};
    return {...s, name};
  } catch(err) { if (releaseTabLock) releaseTabLock(); releaseTabLock = null; throw err; }
}
async function releaseMembership(current) {
  if (!current) return;
  try {
    await db.runTransaction(async tx => {
      const snap = await tx.get(current.ref);
      if (snap.exists && snap.data().sessionId === current.token && snap.data().uid === uid) tx.delete(current.ref);
    });
  } catch { /* 창을 강제 종료했거나 오프라인이면 90초 뒤 만료됩니다. */ }
}
async function heartbeat() {
  if (!membership || heartbeatPending || !S) return;
  const current = membership;
  if (performance.now() - current.confirmedAt >= LEASE_MS) { leave('연결 확인 시간이 지났어요. 학급 코드와 닉네임으로 다시 들어와 주세요.'); return; }
  heartbeatPending = true;
  try {
    await db.runTransaction(async tx => {
      const snap = await tx.get(current.ref);
      if (!snap.exists || snap.data().sessionId !== current.token || snap.data().uid !== uid) throw new Error('nickname-in-use');
      tx.update(current.ref, {updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    if (membership === current) { current.confirmedAt = performance.now(); connectionError = ''; renderPresence(); }
  } catch(err) {
    if (membership !== current) return;
    if (err.message === 'nickname-in-use' || err.code === 'permission-denied') leave(errorMessage(err));
    else { connectionError = '연결을 다시 확인하고 있어요.'; renderPresence(); }
  } finally { heartbeatPending = false; }
}
function activeSession() {
  if (!S || !membership) return false;
  if (performance.now() - membership.confirmedAt >= LEASE_MS) { leave('접속이 만료되었어요. 다시 입장해 주세요.'); return false; }
  if (!navigator.onLine) { alert('인터넷 연결을 확인해 주세요.'); return false; }

}

/* ---------- 단어 묶기 (비슷한 표현 통일) ---------- */
function norm(t) {
  const raw = t.toLowerCase().replace(/[^가-힣a-z0-9]/g, '');
  const s = raw.replace(/럽/g, '러')
    .replace(/(스러움|스러운|스러워|스러웠다|스러다|스러)$/, '')
    .replace(/(움|운|워|웠다|했다|하다|함|해|한|다|요|음)$/, '');
  return s || raw;
}
function wordGroups(pid) {
  const g = new Map();
  words.filter(w => w.postId === pid).forEach(w => {
    const k = norm(w.text) || w.text.trim();
    if (!g.has(k)) g.set(k, {key:k, n:0, ids:[], f:new Map()});
    const x = g.get(k), label = w.text.trim();
    x.n++; x.ids.push(w.id); x.f.set(label, (x.f.get(label) || 0) + 1);
  });
  // 같은 응답은 묶고, 2글자 이상 겹치는 다른 표현도 크기에 반영합니다.
  // 예: 피곤하다/피곤함/너무 피곤해. 연결된 제3의 단어까지 연쇄 합산하지 않습니다.
  const groups = Array.from(g.values());
  const pairs = key => new Set(Array.from({length:Math.max(0,key.length-1)}, (_,i) => key.slice(i,i+2)));
  groups.forEach(x => { x.pairs = pairs(x.key); });
  groups.forEach(x => {
    x.total = groups.reduce((sum,y) => sum + ((x === y || Array.from(x.pairs).some(p => y.pairs.has(p))) ? y.n : 0), 0);
    x.label = Array.from(x.f).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0],'ko'))[0][0];
  });
  return groups.sort((a,b) => b.total-a.total || b.n-a.n || a.label.localeCompare(b.label,'ko'));
}

  }).join('') || '<div class="empty" style="padding:30px 0;width:100%">친구들의 응답을 기다리고 있어요.</div>';
}

// 원래 응답 문서를 유지하고 text만 바꿔 합칩니다. 중복 횟수·작성자는 보존됩니다.
async function changeWordGroup(key,action,text,pid,targetKey = null) {
  if (!isT() || !activeSession() || wordBusy || room.presentId !== pid || room.cmode !== 'word') return;
  const groups = wordGroups(pid), group = groups.find(g => g.key === key), target = groups.find(g => g.key === targetKey);
  if (!group || (targetKey !== null && (!target || target.key === key))) throw new Error('word-changed');
  const nextText = target ? target.label : String(text || '').trim();
  if (action !== 'delete' && (!nextText || nextText.length > 80)) { alert('답변은 1~80자로 입력해 주세요.'); return; }
  const col = roomRef().collection('words');
  wordBusy = true; $('#wordSave').disabled = true; $('#cloud').classList.add('busy');
  try {
    // 큰 학급에서도 쓰기 한도를 넘지 않게 나누며, 각 묶음은 트랜잭션으로 처리합니다.
    for (let offset=0;offset<group.ids.length;offset+=400) {
      const refs = group.ids.slice(offset,offset+400).map(id => col.doc(id));
      await db.runTransaction(async tx => {
        const docs = await Promise.all(refs.map(ref => tx.get(ref)));
        const targetDoc = target ? await tx.get(col.doc(target.ids[0])) : null;
        if (target && (!targetDoc.exists || targetDoc.data().postId !== pid || (norm(targetDoc.data().text) || targetDoc.data().text.trim()) !== targetKey)) throw new Error('word-changed');
        docs.forEach((doc,i) => {
          if (!doc.exists || doc.data().postId !== pid || (norm(doc.data().text) || doc.data().text.trim()) !== key) throw new Error('word-changed');
          if (action === 'delete') tx.delete(refs[i]); else tx.update(refs[i],{text:nextText});
        });
      });
    }
    $('#wordStatus').textContent = action === 'delete' ? `${group.n}개 응답을 삭제했어요.` : target ? `${group.label} 응답을 ${target.label}에 합쳤어요.` : '답변을 수정했어요.';
    closeWordDialog(); closeWordMenu();
  } finally { wordBusy = false; $('#wordSave').disabled = false; $('#cloud').classList.remove('busy'); if (S && room.presentId === pid) renderCloud(pid); }
}
async function mergeWordGroups(sourceKey,targetKey,pid) {
  if (sourceKey === targetKey) return;
  try { await changeWordGroup(sourceKey,'merge','',pid,targetKey); } catch(err) { alert(errorMessage(err)); }
}
$('#wordEditBtn').onclick = () => openWordDialog('edit');
$('#wordMergeBtn').onclick = () => openWordDialog('merge');
$('#wordCancel').onclick = closeWordDialog;
$('#wordDeleteBtn').onclick = async () => {
  if (!wordMenu || !isT()) return;
  const state = {...wordMenu}, group = wordGroups(state.pid).find(g => g.key === state.key); closeWordMenu();
  if (!group || !confirm(`‘${group.label}’의 ${group.n}개 응답을 삭제할까요?`)) return;
  try { await changeWordGroup(state.key,'delete','',state.pid); } catch(err) { alert(errorMessage(err)); }
};
$('#wordSave').onclick = async () => {
  if (!wordDialog || wordBusy) return;
  const state = {...wordDialog};
  if (state.kind === 'merge') return mergeWordGroups(state.key,$('#wordTarget').value,state.pid);
  try { await changeWordGroup(state.key,'edit',$('#wordText').value,state.pid); } catch(err) { alert(errorMessage(err)); }
};
function cancelWordDrag() {
  const old = wordDrag; wordDrag = null;
  if (old) { try { $('#cloud').releasePointerCapture(old.pointerId); } catch {} }
  document.querySelectorAll('#cloud .drag-source,#cloud .drop-target').forEach(el => el.classList.remove('drag-source','drop-target'));
}
$('#cloud').oncontextmenu = e => {
  const el = e.target.closest('[data-word-key]');
  if (!el || !isT()) return;
  e.preventDefault(); cancelWordDrag(); openWordMenu(el.dataset.wordKey,e.clientX,e.clientY);
};
$('#cloud').onkeydown = e => {
  const el = e.target.closest('[data-word-key]');
  if (el && isT() && (e.key === 'Enter' || e.key === ' ' || (e.shiftKey && e.key === 'F10'))) {
    e.preventDefault(); const r = el.getBoundingClientRect(); openWordMenu(el.dataset.wordKey,r.left,r.bottom);
  }
};
$('#cloud').onpointerdown = e => {
  const el = e.target.closest('[data-word-key]');
  if (!el || e.button !== 0 || !isT() || !activeSession() || wordBusy) return;
  closeWordMenu(); wordDrag = {key:el.dataset.wordKey,pid:room.presentId,x:e.clientX,y:e.clientY,pointerId:e.pointerId,moving:false,target:null};
  $('#cloud').setPointerCapture(e.pointerId);
};
$('#cloud').onpointermove = e => {
  if (!wordDrag || e.pointerId !== wordDrag.pointerId) return;
  if (Math.hypot(e.clientX-wordDrag.x,e.clientY-wordDrag.y) < 8 && !wordDrag.moving) return;
  e.preventDefault(); wordDrag.moving = true;
  const target = document.elementFromPoint(e.clientX,e.clientY)?.closest('#cloud [data-word-key]');
  wordDrag.target = target?.dataset.wordKey || null;
  document.querySelectorAll('#cloud [data-word-key]').forEach(el => {
    el.classList.toggle('drag-source',el.dataset.wordKey === wordDrag.key);
    el.classList.toggle('drop-target',el.dataset.wordKey === wordDrag.target && wordDrag.target !== wordDrag.key);
  });
};
$('#cloud').onpointerup = e => {
  if (!wordDrag || e.pointerId !== wordDrag.pointerId) return;
  const drag = {...wordDrag}; cancelWordDrag();
  if (drag.moving) {
    e.preventDefault(); if (drag.target && drag.target !== drag.key) void mergeWordGroups(drag.key,drag.target,drag.pid);
    if (S) renderCloud(room.presentId);
  } else openWordMenu(drag.key,e.clientX,e.clientY);
};
$('#cloud').onpointercancel = () => { cancelWordDrag(); if (S) renderCloud(room.presentId); };
document.addEventListener('click', e => { if (!e.target.closest('#wordMenu') && !e.target.closest('#cloud')) closeWordMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { cancelWordDrag(); closeWordMenu(); closeWordDialog(); } });
window.addEventListener('resize',closeWordMenu);

/* ---------- 교사 화면에만 적용하는 TV 공유 모드 ---------- */
function applyTVRatio(value,persist = false) {
  tvRatio = Math.min(80,Math.max(20,Number(value) || 60));
  $('#present').style.setProperty('--tv-left',tvRatio+'fr');
  $('#present').style.setProperty('--tv-right',(100-tvRatio)+'fr');
  $('#tvDivider').setAttribute('aria-valuenow',String(Math.round(tvRatio)));
  $('#tvDivider').setAttribute('aria-valuetext',`글 ${Math.round(tvRatio)}%, 댓글 ${Math.round(100-tvRatio)}%`);
  if (persist) { try { localStorage.setItem('tb-tv-ratio',String(tvRatio)); } catch {} }
}
$('#tvBtn').onclick = () => {
  if (!isT() || room.mode !== 'present' || !activeSession()) return;
  cancelWordDrag(); closeWordMenu(); closeWordDialog(); tvMode = !tvMode; render();
};
let tvPointer = null;
function resizeTV(e) {
  if (!tvMode || !isT() || tvPointer !== e.pointerId) return;
  const r = $('#present').getBoundingClientRect();
  applyTVRatio((e.clientX-r.left-20)/Math.max(1,r.width-40)*100,true);
}
$('#tvDivider').onpointerdown = e => {
  if (!tvMode || !isT() || e.button !== 0) return;
  tvPointer = e.pointerId; $('#tvDivider').setPointerCapture(e.pointerId); document.body.classList.add('resizing'); e.preventDefault();
};
$('#tvDivider').onpointermove = resizeTV;
function endTVResize(e) { if (tvPointer !== e.pointerId) return; tvPointer = null; document.body.classList.remove('resizing'); try { $('#tvDivider').releasePointerCapture(e.pointerId); } catch {} }
$('#tvDivider').onpointerup = endTVResize;
$('#tvDivider').onpointercancel = endTVResize;
$('#tvDivider').onkeydown = e => {
  if (!tvMode || !isT() || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault(); applyTVRatio(e.key === 'Home' ? 20 : e.key === 'End' ? 80 : tvRatio+(e.key === 'ArrowRight' ? 2 : -2),true);
};

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || !S) return;
  const d = t.dataset;
  if (d.more) { expanded.has(d.more) ? expanded.delete(d.more) : expanded.add(d.more); render(); }
  if (!(d.edit || d.del || d.pick || d.like) || !activeSession()) return;
  try {
  if (d.edit) { const p = posts.find(p => p.id === d.edit); if (p && (isT() || p.authorUid === uid)) openEditor(p); }
  if (d.del && isT() && confirm('이 글을 삭제할까요?')) {
    const ref = roomRef();
    if (room.presentId === d.del) await ref.update({presentId:''});
    await ref.collection('posts').doc(d.del).delete();
  }
  if (d.pick && isT()) await roomRef().update({presentId: d.pick});
  if (d.like) {
    const c = comments.find(x => x.id === d.like), F = firebase.firestore.FieldValue;
    if (c) await roomRef().collection('comments').doc(d.like).update({likes: (c.likes || []).includes(uid) ? F.arrayRemove(uid) : F.arrayUnion(uid)});
  }
  } catch(err) { alert(errorMessage(err)); }
});
async function teacherUpdate(data) {
  if (!activeSession() || !isT()) return;
  try { await roomRef().update(data); } catch(err) { alert(errorMessage(err)); }
}
$('#modeBtn').onclick = () => teacherUpdate(room.mode === 'present' ? {mode: 'board', presentId: ''} : {mode: 'present'});
$('#cmode').onchange = e => teacherUpdate({cmode: e.target.value});
$('#qInput').onchange = e => teacherUpdate({question: e.target.value.trim()});
let sendingComment = false;
async function sendC() {
  if (sendingComment || !activeSession()) return;
  const text = $('#cInput').value.trim(); if (!text || !room.presentId || room.mode !== 'present') return;
  sendingComment = true; $('#cSend').disabled = true;
  const base = {postId: room.presentId, nick: myName(), authorUid: uid, text, createdAt: Date.now()};
  try {
    if (room.cmode === 'word') await roomRef().collection('words').add(base);
    else await roomRef().collection('comments').add({...base, likes: []});
    if ($('#cInput').value.trim() === text) $('#cInput').value = '';
  } catch(err) { alert('댓글을 저장하지 못했어요. 입력 내용은 남겨 두었으니 연결을 확인한 뒤 다시 올려 주세요.'); }
  finally { sendingComment = false; $('#cSend').disabled = !S || !room.presentId; }
}
$('#cSend').onclick = sendC;
$('#cInput').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) sendC(); };

/* ---------- 글쓰기 / 수정 ---------- */
$('#fab').onclick = () => openEditor(null);
$('#mCancel').onclick = () => $('#modal').classList.add('hide');
function openEditor(p) {
  if (!activeSession()) return;
  if (p && !isT() && p.authorUid !== uid) return;
  editingId = p ? p.id : null;
  $('#mTitle').textContent = p ? '글 수정하기' : '글쓰기';
  $('#mSave').textContent = p ? '수정 완료' : '올리기';
  $('#eT').value = p ? p.title : ''; $('#eB').value = p ? p.body : '';
  $('#eN').textContent = p ? p.nick : myName();
  $('#modal').classList.remove('hide'); $('#eT').focus();
}
$('#mSave').onclick = async () => {
  if (!activeSession() || $('#mSave').disabled) return;
  const title = $('#eT').value.trim(), body = $('#eB').value.trim();
  if (!title || !body) return alert('제목과 내용을 모두 써 주세요.');
  const col = roomRef().collection('posts'), now = Date.now();
  $('#mSave').disabled = true;
  try {
    if (editingId) await col.doc(editingId).update({title, body, updatedAt: now});
    else await col.add({title, body, nick: myName(), authorUid: uid, createdAt: now, updatedAt: now});
    $('#modal').classList.add('hide');
  } catch (err) { alert('저장하지 못했어요. 네트워크 상태를 확인해 주세요.'); }
  finally { $('#mSave').disabled = false; }
};

/* 새로고침/튕김 후 자동 복귀 */
if (ok && savedSession && /^\d{5}$/.test(savedSession.code) && typeof savedSession.name === 'string') {
  joining = true; $('#joinBtn').disabled = $('#createBtn').disabled = true;
  authReady.then(() => enter(savedSession)).catch(err => {
    $('#jc').value = savedSession.code; $('#jn').value = savedSession.name;
    sessionStorage.removeItem('tb'); localStorage.removeItem('tb'); alert(errorMessage(err));
  }).finally(() => { joining = false; $('#joinBtn').disabled = $('#createBtn').disabled = false; });
}
</script>
</body>
